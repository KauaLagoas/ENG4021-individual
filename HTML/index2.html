<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <title>Editar usuário</title>

  <style>
    body {
      font-family: Arial, sans-serif;
      background-color: #f0f0f0;
    }

    form {
      background-color: white;
      width: 300px;
      margin: 40px auto;
      padding: 20px;
      border-radius: 8px;
    }

    label {
      display: block;
      margin-top: 10px;
    }

    input {
      width: 100%;
      padding: 8px;
      margin-top: 5px;
      box-sizing: border-box;
    }

    button {
      margin-top: 20px;
      padding: 10px;
      background-color: blue;
      color: white;
      border: none;
      border-radius: 4px;
      cursor: pointer;
    }
  </style>
</head>

<body>

  <form>
    <h2>Editar usuário</h2>

    <label for="nome">Nome</label>
    <input type="text" id="nome" value="Maria Silva">

    <label for="email">E-mail</label>
    <input type="email" id="email" value="maria@email.com">

    <label for="telefone">Telefone</label>
    <input type="text" id="telefone" value="(21) 99999-9999">

    <button type="submit">Salvar</button>
  </form>

</body>
</html>
