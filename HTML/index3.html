<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <title>Lista de usuários</title>

  <style>
    body {
      font-family: Arial, sans-serif;
      background-color: #f0f0f0;
    }

    .caixa {
      background-color: white;
      width: 600px;
      margin: 40px auto;
      padding: 20px;
      border-radius: 8px;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      margin-top: 15px;
    }

    th, td {
      padding: 10px;
      text-align: left;
      border-bottom: 1px solid #ddd;
    }

    th {
      background-color: blue;
      color: white;
    }

    button {
      padding: 6px 12px;
      background-color: blue;
      color: white;
      border: none;
      border-radius: 4px;
      cursor: pointer;
    }
  </style>
</head>

<body>

  <div class="caixa">
    <h2>Lista de usuários</h2>

    <table>
      <tr>
        <th>Nome</th>
        <th>E-mail</th>
        <th>Telefone</th>
        <th>Ação</th>
      </tr>

      <tr>
        <td>Maria Silva</td>
        <td>maria@email.com</td>

        <td><button>Editar</button></td>
      </tr>

      <tr>
        <td>João Souza</td>

        <td><button>Editar</button></td>
      </tr>

      <tr>
        <td>Ana Lima</td>

        <td><button>Editar</button></td>
      </tr>
    </table>
  </div>

</body>
</html>
