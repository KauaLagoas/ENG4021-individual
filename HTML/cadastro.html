<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <title>Cadastro de usuário</title>
  <link rel="stylesheet" href="estilo.css">
</head>
<body>

  <div class="menu">
    <a href="listar.html">Listar</a>
    <a href="cadastro.html">Cadastrar</a>
  </div>

  <form class="caixa">
    <h2>Cadastro de usuário</h2>

    <label for="nome">Nome</label>
    <input type="text" id="nome" placeholder="Digite seu nome" required>

    <label for="email">E-mail</label>
    <input type="email" id="email" placeholder="Digite seu e-mail" required>

    <label for="telefone">Telefone</label>
    <input type="text" id="telefone" placeholder="(21) 99999-9999">

    <label for="senha">Senha</label>
    <input type="password" id="senha" placeholder="Digite uma senha" required>

    <label for="confirmar">Confirmar senha</label>
    <input type="password" id="confirmar" placeholder="Repita a senha" required>

    <button type="submit" class="botao-total">Cadastrar</button>
  </form>

</body>
</html>
